[build]
  # Build command
  command = "npm run build"
  
  # Directory to publish (Vite outputs to 'dist' by default)
  publish = "dist"
  
  # Node version for Netlify build
  [build.environment]
    NODE_VERSION = "18"

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' http://localhost:* http://127.0.0.1:* https://civiltakeoffai.com https://*.civiltakeoffai.com https://*.netlify.app"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Cross-origin isolation enables `globalThis.crossOriginIsolated`, which is
    # required for SharedArrayBuffer. The tile-render WorkerPool uses SAB to
    # share PDF bytes across workers (one buffer instead of N copies on a
    # 500MB construction sheet set, ~2.5GB saved). Embedding parents (CTO)
    # set `credentialless` on their iframes so this doesn't break the embed.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    # Subresources fetched cross-origin under COEP=require-corp must send
    # CORP. Marking ALL responses as cross-origin-shareable is overkill for
    # truly private endpoints, but Nanodoc serves only the static SPA from
    # this domain — there's nothing private here to leak.
    Cross-Origin-Resource-Policy = "cross-origin"

# Headers for WASM files
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

# Headers for JavaScript files
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache WASM files
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
















